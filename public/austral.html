<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austral</title>
<meta name="description" content="Austral. AI Solutions.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;overflow:hidden;background:#000}
.globe{position:absolute;inset:0;background:url(/globe.jpg) 50% 100%/cover no-repeat;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 62%,transparent 100%)}
.content{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.4vw,28px)}
h1{font-size:clamp(34px,7vw,84px);font-weight:700;letter-spacing:.2em;line-height:1;padding-left:.2em}
.tag{font-family:Spectral,Georgia,serif;font-weight:300;font-size:clamp(20px,2.6vw,32px);letter-spacing:-.01em}
.cta{display:inline-block;margin-top:clamp(6px,1vw,12px);padding:14px 34px;border-radius:999px;background:#fff;color:#000;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:background .15s}
.cta:hover{background:#d9d9d9}
.cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cities{display:flex;justify-content:center;align-items:center;font-size:clamp(12px,1.3vw,14px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.cities span{padding:2px clamp(12px,1.6vw,20px);white-space:nowrap}
.cities span+span{border-left:1px solid rgba(255,255,255,.75)}
@media (max-width:480px){.cities{font-size:11px;letter-spacing:.08em;flex-wrap:wrap;row-gap:10px}.cities span{padding:2px 9px}.cities span:nth-child(4){border-left:0}}
</style>
</head>
<body>
<main class="hero">
  <div class="globe" aria-hidden="true"></div>
  <div class="content">
    <h1>AUSTRAL</h1>
    <p class="tag">AI Solutions</p>
    <a class="cta" href="mailto:hola@australhq.com">Contact us</a>
    <p class="cities"><span>Miami</span><span>Bogotá</span><span>São Paulo</span><span>Ciudad de México</span></p>
  </div>
</main>
</body>
</html>
